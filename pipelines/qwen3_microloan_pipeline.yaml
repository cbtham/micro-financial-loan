# PIPELINE DEFINITION
# Name: qwen3-4b-microloan-explanation-pipeline
# Description: Fine-tune Qwen3-4B for generating loan explanations with LoRA
# Inputs:
#    batch_size: int [Default: 4.0]
#    dataset_path: str [Default: 's3://datasets/microloan-dataset/sdg/feature_explanations_dataset.json']
#    learning_rate: float [Default: 0.0002]
#    lora_rank: int [Default: 16.0]
#    minio_access_key: str [Default: 'minio']
#    minio_endpoint: str [Default: 'https://minio-api-minio.apps.cluster-94v2k.94v2k.sandbox393.opentlc.com']
#    minio_secret_key: str [Default: 'minio123']
#    model_name: str [Default: 'Qwen/Qwen3-4B-Instruct-2507']
#    num_epochs: int [Default: 3.0]
#    output_model_name: str [Default: 'qwen3-loan-explanations']
components:
  comp-finetune-qwen3:
    executorLabel: exec-finetune-qwen3
    inputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          parameterType: NUMBER_INTEGER
        learning_rate:
          parameterType: NUMBER_DOUBLE
        lora_rank:
          parameterType: NUMBER_INTEGER
        model_name:
          parameterType: STRING
        num_epochs:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model_output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-load-training-data:
    executorLabel: exec-load-training-data
    inputDefinitions:
      parameters:
        dataset_path:
          parameterType: STRING
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        train_output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-merge-lora-adapters:
    executorLabel: exec-merge-lora-adapters
    inputDefinitions:
      artifacts:
        lora_adapters:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        base_model_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        merged_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-prepare-chat-data:
    executorLabel: exec-prepare-chat-data
    inputDefinitions:
      artifacts:
        train_input:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        model_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        prepared_output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-to-model-registry:
    executorLabel: exec-register-to-model-registry
    inputDefinitions:
      parameters:
        learning_rate:
          parameterType: NUMBER_DOUBLE
        lora_rank:
          parameterType: NUMBER_INTEGER
        model_name:
          parameterType: STRING
        model_uri:
          parameterType: STRING
        num_epochs:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-upload-to-minio:
    executorLabel: exec-upload-to-minio
    inputDefinitions:
      artifacts:
        model_input:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        model_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-finetune-qwen3:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - finetune_qwen3
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'transformers'\
          \ 'trl' 'peft' 'datasets' 'accelerate' 'torch' 'bitsandbytes'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.14.6' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef finetune_qwen3(\n    prepared_data: Input[Dataset],\n    model_name:\
          \ str,\n    lora_rank: int,\n    num_epochs: int,\n    batch_size: int,\n\
          \    learning_rate: float,\n    model_output: Output[Model],\n    metrics:\
          \ Output[Metrics]\n):\n    \"\"\"\n    Fine-tune Qwen3-4B with LoRA for\
          \ loan explanations\n\n    Configuration:\n    - LoRA rank: 16 (optimized\
          \ for 4B model)\n    - Batch size: 4 (L4/A10 GPU)\n    - Gradient accumulation:\
          \ 2 (effective batch = 8)\n    - Epochs: 3\n    - Learning rate: 2e-4\n\
          \    - BF16 precision\n    \"\"\"\n    import torch\n    import json\n \
          \   import time\n    from transformers import AutoTokenizer, AutoModelForCausalLM,\
          \ BitsAndBytesConfig\n    from peft import LoraConfig, get_peft_model, TaskType,\
          \ prepare_model_for_kbit_training\n    from trl import SFTConfig, SFTTrainer\n\
          \    from datasets import Dataset\n\n    # Load prepared data\n    with\
          \ open(prepared_data.path, 'r') as f:\n        data = json.load(f)\n\n \
          \   train_dataset = Dataset.from_list(data[\"train\"])\n    eval_dataset\
          \ = Dataset.from_list(data[\"eval\"])\n\n    print(f\"Loaded: {len(train_dataset)}\
          \ train, {len(eval_dataset)} eval\")\n\n    # Verify GPU\n    if torch.cuda.is_available():\n\
          \        gpu_name = torch.cuda.get_device_name(0)\n        print(f\"GPU:\
          \ {gpu_name}\")\n\n    # Load model with 4-bit quantization\n    print(f\"\
          Loading {model_name}...\")\n\n    bnb_config = BitsAndBytesConfig(\n   \
          \     load_in_4bit=True,\n        bnb_4bit_use_double_quant=True,\n    \
          \    bnb_4bit_quant_type=\"nf4\",\n        bnb_4bit_compute_dtype=torch.bfloat16\n\
          \    )\n\n    tokenizer = AutoTokenizer.from_pretrained(model_name, trust_remote_code=True)\n\
          \    tokenizer.pad_token = tokenizer.eos_token\n    tokenizer.padding_side\
          \ = \"right\"\n\n    model = AutoModelForCausalLM.from_pretrained(\n   \
          \     model_name,\n        quantization_config=bnb_config,\n        device_map=\"\
          auto\",\n        trust_remote_code=True\n    )\n\n    print(f\"Model loaded:\
          \ {torch.cuda.memory_allocated()/1e9:.1f} GB\")\n\n    # LoRA configuration\n\
          \    lora_config = LoraConfig(\n        r=lora_rank,\n        lora_alpha=lora_rank\
          \ * 2,\n        target_modules=[\"q_proj\", \"k_proj\", \"v_proj\", \"o_proj\"\
          , \"gate_proj\", \"up_proj\", \"down_proj\"],\n        lora_dropout=0.05,\n\
          \        bias=\"none\",\n        task_type=TaskType.CAUSAL_LM\n    )\n\n\
          \    model = prepare_model_for_kbit_training(model)\n    model = get_peft_model(model,\
          \ lora_config)\n\n    print(f\"LoRA Config: Rank={lora_rank}, Target Modules={list(lora_config.target_modules)[:4]}...\"\
          )\n    model.print_trainable_parameters()\n\n    # Training configuration\n\
          \    training_args = SFTConfig(\n        output_dir=\"/tmp/qwen3-fine-tuned\"\
          ,\n        num_train_epochs=num_epochs,\n        per_device_train_batch_size=batch_size,\n\
          \        per_device_eval_batch_size=batch_size,\n        gradient_accumulation_steps=2,\n\
          \        learning_rate=learning_rate,\n        bf16=True,\n        logging_steps=10,\n\
          \        eval_strategy=\"epoch\",\n        save_strategy=\"epoch\",\n  \
          \      save_total_limit=2,\n        load_best_model_at_end=True,\n     \
          \   metric_for_best_model=\"eval_loss\",\n        warmup_ratio=0.1,\n  \
          \      lr_scheduler_type=\"cosine\",\n        optim=\"paged_adamw_8bit\"\
          ,\n        gradient_checkpointing=True,\n        max_length=512,\n     \
          \   dataset_text_field=\"text\",\n        packing=False\n    )\n\n    print(f\"\
          Training Config: Batch={batch_size}x2={batch_size*2}, Epochs={num_epochs},\
          \ LR={learning_rate}\")\n\n    # Initialize trainer\n    trainer = SFTTrainer(\n\
          \        model=model,\n        args=training_args,\n        train_dataset=train_dataset,\n\
          \        eval_dataset=eval_dataset,\n        processing_class=tokenizer\n\
          \    )\n\n    # Train\n    print(\"=\"*80)\n    print(\"STARTING QWEN3-4B\
          \ FINE-TUNING FOR LOAN EXPLANATIONS\")\n    print(\"=\"*80)\n\n    start_time\
          \ = time.time()\n    train_result = trainer.train()\n    training_time =\
          \ (time.time() - start_time) / 60\n\n    # Save LoRA adapters\n    trainer.model.save_pretrained(model_output.path)\n\
          \    tokenizer.save_pretrained(model_output.path)\n\n    # Save metrics\n\
          \    training_metrics = {\n        \"training_time_minutes\": training_time,\n\
          \        \"model\": model_name,\n        \"task\": \"loan_explanation_generation\"\
          ,\n        \"lora_rank\": lora_rank,\n        \"epochs\": num_epochs,\n\
          \        \"learning_rate\": learning_rate,\n        **train_result.metrics\n\
          \    }\n\n    with open(f\"{model_output.path}/training_metrics.json\",\
          \ \"w\") as f:\n        json.dump(training_metrics, f, indent=2)\n\n   \
          \ # Log to Kubeflow\n    metrics.log_metric(\"training_time_minutes\", training_time)\n\
          \    metrics.log_metric(\"final_train_loss\", float(train_result.metrics.get('train_loss',\
          \ 0)))\n    metrics.log_metric(\"final_eval_loss\", float(train_result.metrics.get('eval_loss',\
          \ 0)))\n\n    print(\"=\"*80)\n    print(f\"TRAINING COMPLETE - {training_time:.1f}\
          \ minutes\")\n    print(f\"Final eval loss: {train_result.metrics.get('eval_loss',\
          \ 0):.4f}\")\n    print(\"=\"*80)\n\n"
        image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:2025.2
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
          cpuLimit: 8.0
          memoryLimit: 34.359738368
          resourceCpuLimit: '8'
          resourceMemoryLimit: 32Gi
    exec-load-training-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_training_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3' 'urllib3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_training_data(\n    minio_endpoint: str,\n    minio_access_key:\
          \ str,\n    minio_secret_key: str,\n    dataset_path: str,\n    train_output:\
          \ Output[Dataset],\n    metrics: Output[Metrics]\n):\n    \"\"\"Load feature_explanations_dataset.json\
          \ from MinIO\"\"\"\n    import boto3\n    import json\n    import urllib3\n\
          \    from io import BytesIO\n\n    urllib3.disable_warnings()\n\n    s3\
          \ = boto3.client('s3',\n        endpoint_url=minio_endpoint,\n        aws_access_key_id=minio_access_key,\n\
          \        aws_secret_access_key=minio_secret_key,\n        verify=False\n\
          \    )\n\n    # Parse s3://bucket/path format\n    path_parts = dataset_path.replace('s3://',\
          \ '').split('/', 1)\n    bucket = path_parts[0]\n    key = path_parts[1]\
          \ if len(path_parts) > 1 else ''\n\n    print(f\"Loading dataset from s3://{bucket}/{key}\"\
          )\n\n    # Download and load JSON\n    obj = s3.get_object(Bucket=bucket,\
          \ Key=key)\n    training_data = json.loads(obj['Body'].read())\n\n    #\
          \ Save as artifact\n    with open(train_output.path, 'w') as f:\n      \
          \  json.dump(training_data, f)\n\n    # Log metrics\n    metrics.log_metric(\"\
          dataset_size\", len(training_data))\n\n    print(f\"Loaded {len(training_data)}\
          \ training samples\")\n    print(f\"Sample: {training_data[0]}\")\n\n"
        image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:2025.2
    exec-merge-lora-adapters:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - merge_lora_adapters
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'torch' 'transformers'\
          \ 'peft' 'accelerate'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef merge_lora_adapters(\n    lora_adapters: Input[Model],\n    base_model_name:\
          \ str,\n    merged_model: Output[Model],\n    metrics: Output[Metrics]\n\
          ):\n    \"\"\"\n    Merge LoRA adapters into Qwen3 base model for vLLM deployment\n\
          \n    CRITICAL: vLLM requires full merged model, not separate adapters\n\
          \    \"\"\"\n    import torch\n    from transformers import AutoModelForCausalLM,\
          \ AutoTokenizer\n    from peft import PeftModel\n    import os\n\n    print(\"\
          =\"*80)\n    print(\"MERGING LORA ADAPTERS INTO QWEN3 BASE MODEL\")\n  \
          \  print(\"=\"*80)\n\n    # Load tokenizer\n    tokenizer = AutoTokenizer.from_pretrained(base_model_name,\
          \ trust_remote_code=True)\n\n    # Load base model in BF16\n    print(f\"\
          Loading base model {base_model_name}...\")\n    base_model = AutoModelForCausalLM.from_pretrained(\n\
          \        base_model_name,\n        device_map=\"auto\",\n        trust_remote_code=True,\n\
          \        torch_dtype=torch.bfloat16,\n        low_cpu_mem_usage=True\n \
          \   )\n\n    print(f\"Base model loaded: {base_model.get_memory_footprint()\
          \ / 1e9:.1f} GB\")\n\n    # Load LoRA adapters\n    print(f\"Loading LoRA\
          \ adapters from {lora_adapters.path}...\")\n    model_with_lora = PeftModel.from_pretrained(\n\
          \        base_model,\n        lora_adapters.path,\n        torch_dtype=torch.bfloat16\n\
          \    )\n\n    # Merge\n    print(\"Merging LoRA into base model...\")\n\
          \    merged = model_with_lora.merge_and_unload()\n\n    print(f\"Merge completed:\
          \ {merged.get_memory_footprint() / 1e9:.1f} GB\")\n\n    # Save merged model\n\
          \    print(f\"Saving merged model to {merged_model.path}...\")\n    os.makedirs(merged_model.path,\
          \ exist_ok=True)\n\n    merged.save_pretrained(\n        merged_model.path,\n\
          \        safe_serialization=True,\n        max_shard_size=\"2GB\"\n    )\n\
          \n    tokenizer.save_pretrained(merged_model.path)\n\n    file_count = len([f\
          \ for f in os.listdir(merged_model.path) if os.path.isfile(os.path.join(merged_model.path,\
          \ f))])\n\n    print(f\"Merged model saved: {file_count} files\")\n\n  \
          \  # Log metrics\n    metrics.log_metric(\"merged_model_size_gb\", merged.get_memory_footprint()\
          \ / 1e9)\n    metrics.log_metric(\"file_count\", file_count)\n\n    # Cleanup\n\
          \    del base_model, model_with_lora, merged\n    torch.cuda.empty_cache()\n\
          \n    print(\"=\"*80)\n    print(\"MERGE COMPLETE - Model ready for vLLM\
          \ deployment!\")\n    print(\"=\"*80)\n\n"
        image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:2025.2
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
          cpuLimit: 8.0
          memoryLimit: 34.359738368
          resourceCpuLimit: '8'
          resourceMemoryLimit: 32Gi
    exec-prepare-chat-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_chat_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'transformers'\
          \ 'datasets'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_chat_data(\n    train_input: Input[Dataset],\n    model_name:\
          \ str,\n    prepared_output: Output[Dataset],\n    metrics: Output[Metrics]\n\
          ):\n    \"\"\"Format data with Qwen3 chat template\"\"\"\n    import json\n\
          \    from transformers import AutoTokenizer\n    from datasets import Dataset\n\
          \n    # Load data\n    with open(train_input.path, 'r') as f:\n        training_data\
          \ = json.load(f)\n\n    # System prompt\n    SYSTEM_PROMPT = \"You are an\
          \ AI loan officer assistant. Explain loan decisions clearly and professionally\
          \ based on applicant data.\"\n\n    # Format with chat template\n    formatted_data\
          \ = []\n    for item in training_data:\n        chat = [\n            {\"\
          role\": \"system\", \"content\": SYSTEM_PROMPT},\n            {\"role\"\
          : \"user\", \"content\": item[\"input\"]},\n            {\"role\": \"assistant\"\
          , \"content\": item[\"output\"]}\n        ]\n        formatted_data.append({\"\
          messages\": chat})\n\n    # Load tokenizer and apply chat template\n   \
          \ tokenizer = AutoTokenizer.from_pretrained(model_name, trust_remote_code=True)\n\
          \n    dataset = Dataset.from_list(formatted_data)\n\n    def format_chat(example):\n\
          \        text = tokenizer.apply_chat_template(\n            example[\"messages\"\
          ],\n            tokenize=False,\n            add_generation_prompt=False\n\
          \        )\n        return {\"text\": text}\n\n    dataset = dataset.map(format_chat,\
          \ remove_columns=[\"messages\"])\n\n    # Split train/eval\n    split_dataset\
          \ = dataset.train_test_split(test_size=0.1, seed=42)\n\n    # Save\n   \
          \ result = {\n        \"train\": [item for item in split_dataset[\"train\"\
          ]],\n        \"eval\": [item for item in split_dataset[\"test\"]]\n    }\n\
          \n    with open(prepared_output.path, 'w') as f:\n        json.dump(result,\
          \ f)\n\n    # Log metrics\n    metrics.log_metric(\"train_samples\", len(result[\"\
          train\"]))\n    metrics.log_metric(\"eval_samples\", len(result[\"eval\"\
          ]))\n\n    print(f\"Prepared {len(result['train'])} train, {len(result['eval'])}\
          \ eval samples\")\n\n"
        image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:2025.2
    exec-register-to-model-registry:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_to_model_registry
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_to_model_registry(\n    model_uri: str,\n    model_name:\
          \ str,\n    lora_rank: int,\n    num_epochs: int,\n    learning_rate: float,\n\
          \    metrics: Output[Metrics]\n):\n    \"\"\"Register Qwen3 model to Model\
          \ Registry via REST API\"\"\"\n    import requests\n    from datetime import\
          \ datetime\n\n    REGISTRY_API = \"http://model-registry-direct.rhoai-model-registries.svc.cluster.local:8080/api/model_registry/v1alpha3\"\
          \n\n    print(f\"Registering model to Model Registry\")\n    print(f\"Model:\
          \ {model_name}\")\n    print(f\"Storage: {model_uri}\")\n\n    try:\n  \
          \      # Create/fetch registered model\n        model_payload = {\n    \
          \        \"name\": model_name,\n            \"description\": f\"Qwen3-4B\
          \ fine-tuned for microloan explanations with LoRA (rank={lora_rank})\",\n\
          \            \"customProperties\": {}\n        }\n\n        response = requests.post(\n\
          \            f\"{REGISTRY_API}/registered_models\",\n            json=model_payload,\n\
          \            timeout=30\n        )\n\n        if response.status_code in\
          \ [200, 201]:\n            model_data = response.json()\n            model_id\
          \ = model_data.get(\"id\")\n            print(f\"Model registered: ID={model_id}\"\
          )\n        elif response.status_code == 409:\n            # Model exists,\
          \ fetch it\n            get_response = requests.get(\n                f\"\
          {REGISTRY_API}/registered_models\",\n                params={\"name\": model_name},\n\
          \                timeout=30\n            )\n            if get_response.status_code\
          \ == 200:\n                data = get_response.json()\n                items\
          \ = data.get(\"items\", [])\n                if items:\n               \
          \     model_id = items[0][\"id\"]\n                    print(f\"Found existing\
          \ model: ID={model_id}\")\n                else:\n                    raise\
          \ Exception(\"Model not found after creation\")\n        else:\n       \
          \     raise Exception(f\"Model registration failed: {response.text}\")\n\
          \n        # Get existing versions to auto-increment\n        versions_response\
          \ = requests.get(\n            f\"{REGISTRY_API}/model_versions\",\n   \
          \         params={\"registeredModelId\": model_id},\n            timeout=30\n\
          \        )\n\n        existing_versions = []\n        if versions_response.status_code\
          \ == 200:\n            existing_versions = [v[\"name\"] for v in versions_response.json().get(\"\
          items\", [])]\n\n        # Auto-increment version\n        version_num =\
          \ 1\n        while f\"v{version_num}\" in existing_versions:\n         \
          \   version_num += 1\n        version_name = f\"v{version_num}\"\n\n   \
          \     # Register version\n        version_description = f\"LoRA fine-tuned\
          \ Qwen3-4B. Storage: {model_uri}. Rank={lora_rank}, Epochs={num_epochs},\
          \ LR={learning_rate}. Deploy with vLLM runtime.\"\n\n        version_payload\
          \ = {\n            \"name\": version_name,\n            \"description\"\
          : version_description,\n            \"registeredModelId\": model_id\n  \
          \      }\n\n        version_response = requests.post(\n            f\"{REGISTRY_API}/model_versions\"\
          ,\n            json=version_payload,\n            timeout=30\n        )\n\
          \n        if version_response.status_code in [200, 201]:\n            version_data\
          \ = version_response.json()\n            version_id = version_data.get(\"\
          id\")\n\n            print(\"=\"*80)\n            print(\"MODEL REGISTERED\
          \ SUCCESSFULLY\")\n            print(\"=\"*80)\n            print(f\"Model:\
          \ {model_name}\")\n            print(f\"Version: {version_name}\")\n   \
          \         print(f\"Model ID: {model_id}\")\n            print(f\"Version\
          \ ID: {version_id}\")\n            print(f\"Storage: {model_uri}\")\n  \
          \          print(\"=\"*80)\n\n            metrics.log_metric(\"registry_registration_success\"\
          , 1.0)\n        else:\n            print(f\"Version registration failed:\
          \ {version_response.text}\")\n            metrics.log_metric(\"registry_registration_success\"\
          , 0.0)\n\n    except Exception as e:\n        print(f\"Model Registry registration\
          \ failed: {e}\")\n        print(\"Model is still available in MinIO\")\n\
          \        metrics.log_metric(\"registry_registration_success\", 0.0)\n\n"
        image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:2025.2
    exec-upload-to-minio:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - upload_to_minio
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3' 'urllib3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_to_minio(\n    model_input: Input[Model],\n    minio_endpoint:\
          \ str,\n    minio_access_key: str,\n    minio_secret_key: str,\n    model_name:\
          \ str,\n    metrics: Output[Metrics]\n) -> str:\n    \"\"\"Upload merged\
          \ Qwen3 model to MinIO\"\"\"\n    import boto3\n    import urllib3\n   \
          \ import os\n\n    urllib3.disable_warnings()\n\n    s3 = boto3.client('s3',\n\
          \        endpoint_url=minio_endpoint,\n        aws_access_key_id=minio_access_key,\n\
          \        aws_secret_access_key=minio_secret_key,\n        verify=False\n\
          \    )\n\n    # Create models bucket if needed\n    try:\n        s3.create_bucket(Bucket='models')\n\
          \    except:\n        pass\n\n    # Upload as folder structure\n    model_prefix\
          \ = model_name\n    total_size = 0\n    file_count = 0\n\n    print(f\"\
          Uploading merged Qwen3 model as folder: {model_prefix}/\")\n\n    for root,\
          \ dirs, files in os.walk(model_input.path):\n        for file in files:\n\
          \            local_file = os.path.join(root, file)\n            relative_path\
          \ = os.path.relpath(local_file, model_input.path)\n            s3_key =\
          \ f\"{model_prefix}/{relative_path}\"\n\n            file_size = os.path.getsize(local_file)\n\
          \            total_size += file_size\n            file_count += 1\n\n  \
          \          s3.upload_file(local_file, 'models', s3_key)\n            print(f\"\
          \  Uploaded: {relative_path} ({file_size/1e6:.1f} MB)\")\n\n    model_uri\
          \ = f\"s3://models/{model_prefix}/\"\n\n    size_gb = total_size / 1e9\n\
          \    metrics.log_metric(\"model_size_gb\", size_gb)\n    metrics.log_metric(\"\
          file_count\", file_count)\n\n    print(\"=\"*80)\n    print(f\"Qwen3 model\
          \ uploaded\")\n    print(f\"Location: {model_uri}\")\n    print(f\"Total\
          \ size: {size_gb:.2f} GB\")\n    print(f\"Files: {file_count}\")\n    print(\"\
          =\"*80)\n\n    return model_uri\n\n"
        image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pytorch:2025.2
pipelineInfo:
  description: Fine-tune Qwen3-4B for generating loan explanations with LoRA
  name: qwen3-4b-microloan-explanation-pipeline
root:
  dag:
    tasks:
      finetune-qwen3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-finetune-qwen3
        dependentTasks:
        - prepare-chat-data
        inputs:
          artifacts:
            prepared_data:
              taskOutputArtifact:
                outputArtifactKey: prepared_output
                producerTask: prepare-chat-data
          parameters:
            batch_size:
              componentInputParameter: batch_size
            learning_rate:
              componentInputParameter: learning_rate
            lora_rank:
              componentInputParameter: lora_rank
            model_name:
              componentInputParameter: model_name
            num_epochs:
              componentInputParameter: num_epochs
        taskInfo:
          name: finetune-qwen3
      load-training-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-training-data
        inputs:
          parameters:
            dataset_path:
              componentInputParameter: dataset_path
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
        taskInfo:
          name: load-training-data
      merge-lora-adapters:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-merge-lora-adapters
        dependentTasks:
        - finetune-qwen3
        inputs:
          artifacts:
            lora_adapters:
              taskOutputArtifact:
                outputArtifactKey: model_output
                producerTask: finetune-qwen3
          parameters:
            base_model_name:
              componentInputParameter: model_name
        taskInfo:
          name: merge-lora-adapters
      prepare-chat-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-chat-data
        dependentTasks:
        - load-training-data
        inputs:
          artifacts:
            train_input:
              taskOutputArtifact:
                outputArtifactKey: train_output
                producerTask: load-training-data
          parameters:
            model_name:
              componentInputParameter: model_name
        taskInfo:
          name: prepare-chat-data
      register-to-model-registry:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-register-to-model-registry
        dependentTasks:
        - upload-to-minio
        inputs:
          parameters:
            learning_rate:
              componentInputParameter: learning_rate
            lora_rank:
              componentInputParameter: lora_rank
            model_name:
              componentInputParameter: output_model_name
            model_uri:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: upload-to-minio
            num_epochs:
              componentInputParameter: num_epochs
        taskInfo:
          name: register-to-model-registry
      upload-to-minio:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-upload-to-minio
        dependentTasks:
        - merge-lora-adapters
        inputs:
          artifacts:
            model_input:
              taskOutputArtifact:
                outputArtifactKey: merged_model
                producerTask: merge-lora-adapters
          parameters:
            minio_access_key:
              componentInputParameter: minio_access_key
            minio_endpoint:
              componentInputParameter: minio_endpoint
            minio_secret_key:
              componentInputParameter: minio_secret_key
            model_name:
              componentInputParameter: output_model_name
        taskInfo:
          name: upload-to-minio
  inputDefinitions:
    parameters:
      batch_size:
        defaultValue: 4.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      dataset_path:
        defaultValue: s3://datasets/microloan-dataset/sdg/feature_explanations_dataset.json
        isOptional: true
        parameterType: STRING
      learning_rate:
        defaultValue: 0.0002
        isOptional: true
        parameterType: NUMBER_DOUBLE
      lora_rank:
        defaultValue: 16.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      minio_access_key:
        defaultValue: minio
        isOptional: true
        parameterType: STRING
      minio_endpoint:
        defaultValue: https://minio-api-minio.apps.cluster-94v2k.94v2k.sandbox393.opentlc.com
        isOptional: true
        parameterType: STRING
      minio_secret_key:
        defaultValue: minio123
        isOptional: true
        parameterType: STRING
      model_name:
        defaultValue: Qwen/Qwen3-4B-Instruct-2507
        isOptional: true
        parameterType: STRING
      num_epochs:
        defaultValue: 3.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      output_model_name:
        defaultValue: qwen3-loan-explanations
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
---
